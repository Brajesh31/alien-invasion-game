name: README and Documentation Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown entry points
        run: |
          test -s README.md
          test -s docs/README.md
          grep -q "Alien Invasion" README.md
          echo "README and documentation index are present."
